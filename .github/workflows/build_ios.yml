name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into .ipa for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FinAudio.ipa Payload
          rm -rf Payload

      - name: Upload FinAudio.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinAudio-iOS
          path: FinAudio.ipa
          retention-days: 30

      - name: Publish FinAudio.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest-build
          name: "FinAudio Latest iOS Build"
          draft: false
          prerelease: false
          files: FinAudio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
