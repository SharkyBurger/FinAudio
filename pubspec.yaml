name: finaudio
description: "Ad-free YouTube audio player with Google playlist sync."
publish_to: 'none'
version: 0.4.2+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  youtube_explode_dart: ^3.1.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  google_sign_in: ^7.2.0
  rxdart: ^0.28.0
  http: ^1.2.0
  crypto: ^3.0.3
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.1.0
  youtube_player_iframe: ^6.0.2
  audio_service: ^0.18.19
  ytmusicapi_dart: ^2.4.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.2
  dart_discord_presence:
    path: packages/dart_discord_presence
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icons/ic_launcher.png"
    icon_size: 256

